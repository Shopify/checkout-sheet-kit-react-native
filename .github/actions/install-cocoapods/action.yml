name: Cocoapods
description: Prepare the legacy architecture test harness

runs:
  using: composite
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@829114fc20da43a41d27359103ec7a63020954d4 # v1.255.0
      with:
        ruby-version: 3.3.6
        bundler-cache: true
        working-directory: sample

    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen

    - name: Cache cocoapods
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: test/rct-integration-app/Pods
        key: >-
          ${{ runner.os }}-cocoapods-${{ env.RCT_NEW_ARCH_ENABLED }}-${{
          hashFiles('test/rct-integration-app/Podfile.lock',
          'test/rct-integration-app/pnpm-lock.yaml', 'sample/Gemfile.lock',
          'modules/@shopify/checkout-sheet-kit/package.json') }}
