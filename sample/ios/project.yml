name: ReactNative
options:
  minimumXcodeGenVersion: 2.43.0
  projectFormat: xcode14_0
  deploymentTarget:
    iOS: '16.6'
configs:
  Debug: debug
  Release: release
schemes:
  ReactNative:
    build:
      targets:
        ReactNative: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  ReactNative:
    type: application
    platform: iOS
    dependencies:
      - sdk: UIKit.framework
    sources:
      - AppDelegate.swift
      - path: ReactNative
        excludes:
          - Info.plist
          - '*.entitlements'
      - path: ../../node_modules/react-native-vector-icons/Fonts
        buildPhase: resources
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopify.example.CheckoutKitReactNative
        INFOPLIST_FILE: ReactNative/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Checkout Kit React Native Demo
        DEVELOPMENT_TEAM: A7XGC83MZE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: ReactNative/ReactNative.entitlements
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/Frameworks'
    preBuildScripts:
      - name: Bundle React Native code and images
        basedOnDependencyAnalysis: false
        script: |
          set -e
          WITH_ENVIRONMENT="$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"
          /bin/sh "$WITH_ENVIRONMENT" "$REACT_NATIVE_XCODE"
          "$SRCROOT/../scripts/write_ios_metro_host"
